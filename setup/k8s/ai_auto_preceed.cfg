### Localization
d-i debian-installer/locale string en_US.UTF-8                    # Set system locale to US English UTF-8
d-i keyboard-configuration/xkb-keymap select us                    # Set keyboard layout to US English

### Network configuration
d-i netcfg/choose_interface select auto-ethernet                   # Automatically select first available Ethernet interface (ignore wireless)
d-i netcfg/get_domain string local                                 # Set domain name to "local"
d-i netcfg/wireless_wep string                                     # Leave WEP key empty (not using WEP)

# Disable network configuration if no network available
d-i netcfg/enable boolean true                                     # Enable network configuration during install
d-i netcfg/target_network_config select Netplan                    # Netplan with systemd-networkd (modern, YAML-based)

### Mirror settings
d-i mirror/country string manual                                   # Manually specify mirror instead of selecting by country
d-i mirror/http/hostname string deb.debian.org                     # Use official Debian mirror hostname
d-i mirror/http/directory string /debian                           # Mirror directory path for Debian packages
d-i mirror/http/proxy string                                       # No HTTP proxy (leave empty)
d-i mirror/suite string stable                                     # Install stable release (currently Bookworm/Trixie)

### Account setup
# Skip root login (will create sudo user instead)
d-i passwd/root-login boolean false                                # Disable root account login (best practice for servers)

# Create regular user account
d-i passwd/user-fullname string Bohdan Buchok                      # Full name for the user account
d-i passwd/username string bchk                                    # Username for the account (will have sudo access)

### Clock and time zone
d-i clock-setup/utc boolean true                                   # Set hardware clock to UTC (recommended for servers)
d-i time/zone string America/New_York                              # Set timezone to Eastern Time
d-i clock-setup/ntp boolean true                                   # Enable NTP time synchronization
d-i clock-setup/ntp-server string 0.debian.pool.ntp.org           # Use Debian's NTP pool servers

### Partitioning
# Use entire disk with LVM
d-i partman-auto/method string lvm                                 # Use LVM (Logical Volume Manager) for partitioning
d-i partman-auto-lvm/guided_size string max                        # Use maximum available space for LVM
d-i partman-auto-lvm/new_vg_name string vg00                       # Name the volume group "vg00"

d-i partman-auto/init_automatically_partition select Guided - use entire disk and set up LVM  # Trigger guided LVM setup (user selects disk)

# Partitioning scheme - separate /var for servers
d-i partman-auto/choose_recipe select multi                        # Separate /home, /var, and /tmp (BEST for servers)

# Confirm LVM and partitioning
d-i partman-lvm/device_remove_lvm boolean true                     # Automatically remove existing LVM configurations
d-i partman-md/device_remove_md boolean true                       # Automatically remove existing RAID configurations
d-i partman-lvm/confirm boolean true                               # Confirm LVM configuration without asking
d-i partman-lvm/confirm_nooverwrite boolean true                   # Confirm even if not overwriting existing data
d-i partman-auto/confirm boolean true                              # Confirm automatic partitioning choices
d-i partman-partitioning/confirm_write_new_label boolean true      # Confirm writing new partition table
d-i partman/choose_partition select finish                         # Automatically select "Finish partitioning"
d-i partman/confirm boolean true                                   # Final confirmation to write changes to disk
d-i partman/confirm_nooverwrite boolean true                       # Confirm even if not overwriting

### Base system installation
d-i base-installer/install-recommends boolean false                # Don't install recommended packages (minimal install)
d-i base-installer/kernel/image string linux-image-amd64           # Install 64-bit AMD/Intel kernel

### Apt setup
d-i apt-setup/non-free-firmware boolean true                       # Enable non-free firmware repository (for hardware drivers)
d-i apt-setup/non-free boolean false                               # Disable non-free software repository
d-i apt-setup/contrib boolean false                                # Disable contrib repository
d-i apt-setup/enable-source-repositories boolean false             # Don't enable source code repositories
d-i apt-setup/services-select multiselect security, updates        # Enable security and regular update repositories
d-i apt-setup/cdrom/set-first boolean false                        # Don't use installation CD as package source
d-i apt-setup/use_mirror boolean true                              # Use network mirror for packages

### Package selection
tasksel tasksel/first multiselect standard, ssh-server             # Standard utilities + SSH
d-i pkgsel/include string sudo vim curl wget net-tools htop        # Additional packages to install
d-i pkgsel/upgrade select safe-upgrade                             # Upgrade installed packages to latest versions
d-i pkgsel/update-policy select none                               # Don't configure automatic updates (manual only)
popularity-contest popularity-contest/participate boolean false    # Don't participate in package popularity contest

### Boot loader installation
d-i grub-installer/only_debian boolean true                        # Install GRUB assuming Debian is the only OS
d-i grub-installer/with_other_os boolean true                      # Allow GRUB to detect other operating systems
d-i grub-installer/bootdev string default                          # Install GRUB to default location (usually MBR/ESP)

# For UEFI systems
d-i grub-installer/force-efi-extra-removable boolean true          # Install GRUB to fallback UEFI path (for better compatibility)

### Finishing up
d-i finish-install/reboot_in_progress note                         # Show message that system is rebooting
d-i debian-installer/exit/poweroff boolean false                   # Reboot after installation (don't power off)

### Preseeding other packages
d-i preseed/late_command string \                                  # Commands to run after installation (before reboot):
    in-target apt-get update; \                                    #   - Update package lists in new system
    in-target apt-get install -y sudo; \                           #   - Ensure sudo is installed
    in-target usermod -aG sudo bchk; \                            #   - Add 'admin' user to sudo group
    in-target sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin no/' /etc/ssh/sshd_config  # Disable root SSH login for security
