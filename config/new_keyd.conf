# q = S-1                 # Shift + 1
# q = A-1                 # Alt + 1

[ids]
*
[main]

shift = oneshot(shift)

capslock = overload(control, backspace)
leftalt = overload(f_layer, oneshot(alt))
rightalt = overload(altgr, esc)

space = overload(meta, space)

leftcontrol = noop
# meta = noop
esc = noop

[f_layer:C]
k = up
h = left
j = down
l = right
u = home
o = end

v = macro(S-enter C-c ``` S-enter C-v S-enter ``` )

[c_layer:M]
space = meta

a = 1
s = 2
d = 3
f = 4
g = 5
h = 6
j = 7
k = 8
l = 9
; = 0

